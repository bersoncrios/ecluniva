<section class="billing-page"><div class="page-heading"><div><div class="eyebrow">PLANO DA SOCIEDADE</div><h1>Escolha seu plano</h1><p>Comece gratuitamente e evolua quando sua sociedade crescer.</p></div></div>
@if (error()) { <div class="alert error" role="alert">{{ error() }}</div> }<div class="billing-grid">@for (plan of plans; track plan.key) {<article class="panel billing-card" [class.featured]="plan.featured">@if(plan.featured){<span class="billing-badge">Mais escolhido</span>}<h2>{{plan.name}}</h2><strong>{{plan.price}}</strong><p>{{plan.description}}</p><button class="button" type="button" (click)="subscribe(plan.key)" [disabled]="!!busy()">{{busy()===plan.key?'Abrindo pagamento…':'Assinar plano'}}</button></article>}</div></section>

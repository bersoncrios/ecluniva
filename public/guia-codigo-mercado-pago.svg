<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Onde encontrar o número da transação no Mercado Pago</title>
  <desc id="desc">Exemplo ilustrativo de uma venda aprovada. O número fica abaixo do rótulo N.º da transação e deve ser copiado para a verificação no Quadrei.</desc>
  <rect width="920" height="500" rx="28" fill="#f3f6f2"/>
  <rect x="38" y="28" width="392" height="444" rx="26" fill="#fff" stroke="#dce4dc" stroke-width="2"/>
  <circle cx="78" cy="72" r="20" fill="#eef2fc"/><path d="m83 62-10 10 10 10" fill="none" stroke="#4652dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="105" cy="144" r="39" fill="#f7f8fb" stroke="#d9dce8" stroke-width="3"/><path d="M93 135h24l-2 25H95z M99 135v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#30333b" stroke-width="3" stroke-linejoin="round"/>
  <text x="70" y="230" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#252833">R$ 9,90</text>
  <text x="70" y="265" font-family="Arial,sans-serif" font-size="16" fill="#686d7a">Venda por assinatura</text>
  <circle cx="80" cy="300" r="11" fill="#398b48"/><path d="m75 300 4 4 7-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="306" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#398b48">Aprovado</text>
  <text x="70" y="358" font-family="Arial,sans-serif" font-size="15" fill="#777c87">N.º da transação</text>
  <rect x="58" y="370" width="352" height="68" rx="12" fill="#f3f6f2" stroke="#498366" stroke-width="3"/>
  <text x="78" y="413" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#252833">123456789012</text>
  <rect x="306" y="389" width="26" height="28" rx="4" fill="none" stroke="#4652dc" stroke-width="2.5"/><rect x="315" y="381" width="26" height="28" rx="4" fill="#fff" stroke="#4652dc" stroke-width="2.5"/>
  <path d="M452 255h92" stroke="#498366" stroke-width="4" stroke-linecap="round"/><path d="m530 242 15 13-15 13" fill="none" stroke="#498366" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="570" y="94" width="310" height="306" rx="22" fill="#fff" stroke="#dce4dc" stroke-width="2"/>
  <circle cx="624" cy="150" r="24" fill="#e8f2e9"/><path d="m613 150 8 8 15-17" fill="none" stroke="#398b48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="665" y="145" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#252833">PAGAMENTO</text>
  <text x="665" y="168" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#398b48">APROVADO</text>
  <text x="604" y="226" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#252833">Copie este número</text>
  <text x="604" y="257" font-family="Arial,sans-serif" font-size="15" fill="#686d7a">No app Mercado Pago:</text>
  <text x="604" y="292" font-family="Arial,sans-serif" font-size="15" fill="#252833">1. Abra a venda aprovada</text>
  <text x="604" y="323" font-family="Arial,sans-serif" font-size="15" fill="#252833">2. Localize “N.º da transação”</text>
  <text x="604" y="354" font-family="Arial,sans-serif" font-size="15" fill="#252833">3. Copie o código numérico</text>
  <text x="604" y="430" font-family="Arial,sans-serif" font-size="13" fill="#777c87">O código acima é apenas um exemplo.</text>
</svg>
